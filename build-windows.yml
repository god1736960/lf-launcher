name: Build Windows (.exe)

# Compila LF Launcher en un ordenador Windows REAL en la nube (GitHub Actions).
# Tu NO necesitas instalar Node, Rust ni Visual Studio: GitHub lo hace por ti
# y te deja el instalador/.exe listo para descargar.
#
# Como usarlo:
#   1) Sube este proyecto a un repositorio de GitHub (gratis).
#   2) Entra en la pestana "Actions" del repositorio.
#   3) Elige "Build Windows (.exe)" y pulsa "Run workflow".
#   4) Cuando termine (unos minutos), descarga el artefacto
#      "LF-Launcher-Windows": dentro esta el instalador .exe/.msi.

on:
  workflow_dispatch:      # permite lanzarlo a mano desde la pestana Actions
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache de Rust (acelera compilaciones futuras)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependencias del frontend
        run: npm install

      - name: Compilar la app (Tauri build)
        run: npm run tauri build

      - name: Publicar el instalador y el .exe
        uses: actions/upload-artifact@v4
        with:
          name: LF-Launcher-Windows
          if-no-files-found: warn
          path: |
            src-tauri/target/release/*.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
